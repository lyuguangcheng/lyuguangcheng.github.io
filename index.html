<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人网站 — 项目、随笔与联系方式。" />
    <meta name="author" content="" />
    <meta name="theme-color" content="#f6f7fb" />

    <title>Lvguangcheng</title>

    <!-- 主题预置：避免首帧白闪 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('lgc-theme');
                if (!t) {
                    t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', t);
                var l = localStorage.getItem('lgc-lang');
                if (!l) {
                    l = (navigator.language || 'zh').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
                }
                document.documentElement.setAttribute('lang', l === 'zh' ? 'zh-CN' : 'en');
            } catch (e) { /* 忽略隐私模式下的存储异常 */ }
        })();
    </script>

    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;700&family=Space+Grotesk:wght@300;600&family=Noto+Sans+SC:wght@300;500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=7" />

    <!-- Markdown 渲染器（离线时自动降级为纯文本，见 app.js） -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
    <div class="bg-noise" aria-hidden="true"></div>
    <div class="ambient-glow" aria-hidden="true"></div>

    <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a class="logo" href="#home" data-page="home">Lvguangcheng<span class="dot">.</span></a>

            <nav class="nav-links" id="nav-links" aria-label="主导航">
                <a href="#home" data-page="home" data-i18n="navHome">首页</a>
            </nav>

            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn theme-btn" aria-label="切换主题" title="切换主题">
                    <span class="icon-sun" aria-hidden="true">☀</span>
                    <span class="icon-moon" aria-hidden="true">☾</span>
                </button>
                <button id="lang-toggle" class="icon-btn lang-btn" aria-label="切换语言" title="切换语言">EN</button>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div id="content-area" aria-live="polite">
            <div class="loading-state">
                <span class="spinner"></span>
                <p>加载中…</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <!-- 访问量：hits.sh 的 SVG 徽章，每加载一次页面 +1，无需注册与密钥。
                 若这里加载不出来（境外服务偶发不可达），可整行换成国内服务：
                 https://visitor-badge.laobi.icu/badge?page_id=lyuguangcheng.github.io&left_text=%E8%AE%BF%E9%97%AE%E9%87%8F -->
            <p class="visitor-stat">
                <img src="https://hits.sh/lyuguangcheng.github.io.svg?label=%E8%AE%BF%E9%97%AE%E9%87%8F&color=4f46e5&labelColor=6b7280"
                    alt="访问量" width="76" height="20" loading="lazy" referrerpolicy="no-referrer" />
            </p>
        </div>
    </footer>

    <button id="back-to-top" class="back-to-top" aria-label="回到顶部" title="回到顶部">↑</button>

    <!-- 内嵌的 Markdown 内容（由 build-content.ps1 生成），让 file:// 直接打开也能显示 -->
    <script src="content-bundle.js?v=4"></script>
    <script src="app.js?v=7"></script>
</body>

</html>
